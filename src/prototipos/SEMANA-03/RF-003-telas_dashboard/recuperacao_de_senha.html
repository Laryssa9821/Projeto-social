<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Well - Criar Nova Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html">
                <div class="logo-text">Sleep Well</div>
                <div class="logo-sub">Colchonetes Recicláveis</div>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="sobre_nos.html">SOBRE NÓS</a></li>
                <li><a href="compre_e_ajude.html">COMPRE E AJUDE</a></li>
                <li><a href="impacto_social.html">IMPACTO SOCIAL</a></li>
            </ul>
        </nav>
    </header>

    <main class="recovery-section">
        <div class="recovery-box">
            
            <div class="recovery-header">
                <h2>Criar Nova Senha</h2>
                <p>Sua senha deve conter no mínimo 8 e no máximo 70 caracteres.</p>
            </div>

            <!-- Adicionamos o evento onsubmit para checar se as senhas são iguais antes de enviar -->
            <form action="#" method="POST" onsubmit="validarSenhas(event)">
                
            <div class="input-group">
    <label for="nova-senha">Nova senha</label>
    <!-- Nova caixa exclusiva para agrupar o input e o ícone -->
    <div class="senha-wrapper">
        <input type="password" id="nova-senha" name="nova_senha" placeholder="Digite a nova senha" required minlength="8" maxlength="70">
        <span class="toggle-password" onclick="toggleVisibilidade('nova-senha', 'icone-nova')" title="Mostrar senha">
            <span id="icone-nova">👁️</span>
        </span>
    </div>
</div>

<div class="input-group">
    <label for="confirma-senha">Confirme a senha</label>
    <!-- Nova caixa exclusiva para agrupar o input e o ícone -->
    <div class="senha-wrapper">
        <input type="password" id="confirma-senha" name="confirma_senha" placeholder="Repita a senha" required minlength="8" maxlength="70">
        <span class="toggle-password" onclick="toggleVisibilidade('confirma-senha', 'icone-confirma')" title="Mostrar senha">
            <span id="icone-confirma">👁️</span>
        </span>
    </div>
</div>   

                <button type="submit" class="btn-recovery">SALVAR NOVA SENHA</button>
            </form>

            <p class="login-link"><a href="#" onclick="document.querySelector('form').reset(); return false;">Limpar</a></p>
            <p class="login-link"><a href="index.html">← Voltar para o login</a></p>
        </div>
    </main>

    <script>
        // Função do Olhinho adaptada para funcionar em vários campos
        function toggleVisibilidade(idInput, idIcone) {
            const input = document.getElementById(idInput);
            const icone = document.getElementById(idIcone);
            
            if (input.type === 'password') {
                input.type = 'text';
                icone.innerText = '🙈';
            } else {
                input.type = 'password';
                icone.innerText = '👁️';
            }
        }

        // Função para garantir que o usuário não digite senhas diferentes
        function validarSenhas(event) {
            const senha1 = document.getElementById('nova-senha').value;
            const senha2 = document.getElementById('confirma-senha').value;

            if (senha1 !== senha2) {
                // Exibe o alerta
                alert('As senhas não coincidem! Por favor, digite senhas iguais.');
                // Cancela o envio do formulário
                event.preventDefault(); 
            }
        }
    </script>

</body>
</html>
