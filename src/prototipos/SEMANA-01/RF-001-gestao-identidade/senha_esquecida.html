    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

    <!-- Cabeçalho padrão -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <div class="logo-text">Sleep Well</div>
                <div class="logo-sub">Colchonetes Recicláveis</div>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="sobre_nos.html">SOBRE NÓS</a></li>

        </nav>
    </header>

    <!-- Seção de Recuperação de Senha -->
    <main class="recovery-section">
        <div class="recovery-box">
            
            <div class="recovery-header">
                <h2>🔒 Recuperar Senha</h2>
                <p>Esqueceu sua senha? Não se preocupe! Digite seu e-mail abaixo e enviaremos um link para você criar uma nova.</p>
            </div>

            <!-- Formulário -->
            <form action="#" method="POST">
                <!-- Reutilizando a classe input-group que já criamos no cadastro -->
                <div class="input-group">
                    <label>E-mail cadastrado</label>
                    <input type="email" placeholder="seu@email.com" required>
                </div>

                <button type="submit" class="btn-recovery">ENVIAR LINK</button>
            </form>

            <!-- Link para voltar usando a mesma classe que já temos -->
            <p class="login-link"><a href="index.html">← Voltar para o login</a></p>
        </div>
    </main>
