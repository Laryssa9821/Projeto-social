<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Well - Alteração de Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html">
                <div class="logo-text">Sleep Well</div>
                <div class="logo-sub">Colchonetes Recicláveis</div>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="sobre_nos.html">SOBRE NÓS</a></li>
                <li><a href="compre_e_ajude.html">COMPRE E AJUDE</a></li>
                <li><a href="impacto_social.html">IMPACTO SOCIAL</a></li>
            </ul>
        </nav>
    </header>

    <main class="recovery-section">
        <div class="recovery-box">
            
            <div class="recovery-header">
                <h2>Alteração de Senha</h2>
                <p>Sua senha deve conter no mínimo 8 e no máximo 70 caracteres.</p>
            </div>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="nova-senha">Nova senha</label>
                    <input type="password" id="nova-senha" placeholder="Digite a nova senha" required minlength="8" maxlength="70">
                </div>

                <div class="input-group">
                    <label for="confirma-senha">Confirme a senha</label>
                    <input type="password" id="confirma-senha" placeholder="Repita a senha" required minlength="8" maxlength="70">
                </div>

                <button type="submit" class="btn-recovery">CONFIRMAR</button>
            </form>

            <p class="login-link"><a href="#" onclick="document.querySelector('form').reset(); return false;">Limpar</a></p>
            <p class="login-link"><a href="login.html">← Voltar para o login</a></p>
        </div>
    </main>

</body>
</html>
