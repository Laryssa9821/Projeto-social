<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Well - Alteração de Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho padrão -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <div class="logo-text">Sleep Well</div>
                <div class="logo-sub">Colchonetes Recicláveis</div>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="sobre_nos.html">SOBRE NÓS</a></li>
                <li><a href="compre_e_ajude.html">COMPRE E AJUDE</a></li>
                <li><a href="impacto_social.html">IMPACTO SOCIAL</a></li>
                
            </ul>
        </nav>
    </header>

    <!-- Seção de Alteração de Senha -->
    <main class="recovery-section">
        <div class="recovery-box">
            
            <div class="recovery-header">
                <h2>Alteração de Senha</h2>
                <p>Sua senha deve conter no mínimo 8 e no máximo 70 caracteres.</p>
            </div>

            <!-- Formulário -->
            <form action="#" method="POST">
                <!-- Reutilizando a classe input-group que já criamos no cadastro -->
                <div class="input-group">
                    <label>CPF</label>
                    <input type="text" placeholder="000.000.000-00" required>
                </div>

                <div class="input-group">
                    <label>Digite a senha atual</label>
                    <input type="password" placeholder="Digite a senha atual" required>
                </div>

                <div class="input-group">
                    <label>Nova senha</label>
                    <input type="password" placeholder="Digite a nova senha" required>
                </div>

                <div class="input-group">
                    <label>Confirme a senha</label>
                    <input type="password" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-recovery">CONFIRMAR</button>
            </form>

            <!-- JS -->
            <!-- Link para limpar/voltar, usando a mesma classe já criada para os links da página -->
            <p class="login-link"><a href="#" onclick="document.querySelector('form').reset(); return false;">Limpar</a></p>
            <p class="login-link"><a href="index.html">← Voltar para o login</a></p>
        </div>
    </main>

</body>
</html>
