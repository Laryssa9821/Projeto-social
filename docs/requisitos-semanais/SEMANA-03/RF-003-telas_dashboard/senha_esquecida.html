<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Well - Recuperação de Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html">
                <div class="logo-text">Sleep Well</div>
                <div class="logo-sub">Colchonetes Recicláveis</div>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="sobre_nos.html">SOBRE NÓS</a></li>
                <li><a href="compre_e_ajude.html">COMPRE E AJUDE</a></li>
                <li><a href="impacto_social.html">IMPACTO SOCIAL</a></li>
            </ul>
        </nav>
    </header>

   <main class="recovery-section">
        <div class="recovery-box">
            
            <div class="recovery-header">
                <h2>Recuperar Senha</h2>
    <p>Digite o seu e-mail cadastrado. Enviaremos um link para você redefinir sua senha.</p>

    <form id="formRecuperacao">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="seu@email.com" 
          required
        >
      </div>

      <button type="submit">Enviar link de recuperação</button>
    </form>

    <!-- Mensagem exibida via JavaScript ao enviar -->
    <div id="mensagemSucesso" class="mensagem">
      Se o e-mail estiver cadastrado, você receberá as instruções em instantes!
    </div>

    <a href="index.html" class="voltar-login">← Voltar para o Login</a>
  </div>

 <script>
  const form = document.getElementById('formRecuperacao');
  const mensagem = document.getElementById('mensagemSucesso');
  const emailInput = document.getElementById('email');

  // Função movida para o escopo principal
  function formatarEmail(campo) {
    let texto = campo.value.toLowerCase();
    campo.value = texto.replace(/\s/g, '');
  }

  // Formata o e-mail em tempo real enquanto o usuário digita
  emailInput.addEventListener('input', function() {
    formatarEmail(emailInput);
  });

  form.addEventListener('submit', function(event) {
    event.preventDefault(); // Impede o recarregamento da página

    // Exibe a mensagem de sucesso
    mensagem.style.display = 'block';

    // Limpa o campo de e-mail após a submissão
    emailInput.value = '';
  });
</script>

</body>
</html>
