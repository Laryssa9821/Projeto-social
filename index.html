<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Well - Login</title>
    <!-- Fonte do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Conexão com o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo-container">
            <div>
                <div class="logo-text">Sleep Well</div>
                <div class="logo-sub">Colchonetes Recicláveis</div>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#">SOBRE NÓS</a></li>
                <li><a href="#">COMPRE E AJUDE</a></li>
                <li><a href="#">IMPACTO SOCIAL</a></li>
            </ul>
        </nav>
    </header>

    <!-- Seção Principal com o Login -->
    <main class="hero-section">
        <div class="login-box">
            <h2>ACESSE SUA CONTA</h2>
            
            <!-- Abas de Seleção de Acesso -->
            <div class="tabs-container">
    
    <button class="tab-btn admin-tab active" onclick="mudarAcesso('admin', this)">Acesso Administrativo</button>
    
    <button class="tab-btn fin-tab" onclick="mudarAcesso('financeiro', this)">Acesso Financeiro</button>
</div>
            
            <form action="#" method="POST">
                <!-- Campo oculto para enviar a informação de qual acesso foi escolhido -->
                <input type="hidden" name="tipo_acesso" id="tipo_acesso" value="admin">

                <div class="form-group">
                    <input type="text" name="usuario" placeholder="E-mail ou Usuário" required>
                </div>
                <div class="form-group">
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>
                
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
                
                <button type="submit" class="btn-login" id="btn-entrar">ENTRAR</button>
            </form>

            <div class="social-login">
                <p>Ou entre com:</p>
                <div class="social-icons">
                    <div class="social-btn" style="color: #DB4437;">G</div>
                    <div class="social-btn" style="color: #4267B2;">f</div>
                </div>
            </div>

            <p class="register-link">Ainda não tem conta? <span>CADASTRE-SE</span></p>
        </div>
    </main>

    <!-- Script simples para fazer as abas funcionarem -->
    <script>
        function mudarAcesso(tipo, elementoClicado) {
            // Remove a classe 'active' de todos os botões
            const botoes = document.querySelectorAll('.tab-btn');
            botoes.forEach(botao => botao.classList.remove('active'));
            
            // Adiciona a classe 'active' no botão clicado
            elementoClicado.classList.add('active');
            
            // Atualiza o valor do campo oculto do formulário
            document.getElementById('tipo_acesso').value = tipo;
            
            // Opcional: Muda o texto do botão principal para ficar mais claro
            const btnEntrar = document.getElementById('btn-entrar');
            if(tipo === 'admin') {
                btnEntrar.innerText = 'ENTRAR - ADMINISTRATIVO';
                btnEntrar.style.backgroundColor = 'var(--earth-green)';
            } else {
                btnEntrar.innerText = 'ENTRAR - FINANCEIRO';
                btnEntrar.style.backgroundColor = 'var(--dark-blue)'; // Muda a cor para diferenciar
            }
        }
    </script>

</body>
</html>
