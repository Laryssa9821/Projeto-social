<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Well - Login</title>
    <!-- Fonte do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Conexão com o arquivo CSS externo que criei com nome Style-->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- nosso cabeçalho -->
    <header>
        <div class="logo-container">
            <div>
                <div class="logo-text">Sleep Well</div>
                <div class="logo-sub">Colchonetes Recicláveis</div>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="sobre_nos.html">SOBRE NÓS</a></li>
                <li><a href="compre_e_ajude.html">COMPRE E AJUDE</a></li>
                <li><a href="impacto_social.html">IMPACTO SOCIAL</a></li>
            </ul>
        </nav>
    </header>

    <!-- Seção Principal com o Login -->
    <main class="hero-section">
        <div class="login-box">
            <h2>ACESSE SUA CONTA</h2>
            
            <!-- Abas de Seleção de Acesso -->
            <div class="tabs-container">
                <button class="tab-btn credenciado-tab active" onclick="mudarAcesso('credenciado', this)">Acesso Credenciado</button>
                <button class="tab-btn gerente-tab" onclick="mudarAcesso('gerente', this)">Acesso Gerente</button>
            </div>
            
            <form action="#" method="POST">
                <!-- Campo oculto informando qual acesso foi escolhido -->
                <input type="hidden" name="tipo_acesso" id="tipo_acesso" value="credenciado">

                <div class="form-group">
                    <input type="text" name="usuario" placeholder="E-mail ou Usuário" required>
                </div>
                <div class="form-group">
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>
                
              <a href="senha_esquecida.html" class="forgot-password">Esqueceu a senha?</a>
                
                <button type="submit" class="btn-login" id="btn-entrar">ENTRAR - CREDENCIADO</button>
            </form>

            <div class="social-login">
                <p>Ou entre com:</p>
                <div class="social-icons">
                    
                    <a href="https://accounts.google.com" target="_blank" class="social-btn" style="color: #DB4437;">G</a>
                    
                    <a href="https://www.facebook.com/login" target="_blank" class="social-btn" style="color: #4267B2;">f</a>
                </div>
            </div>

            <!-- Botão de cadastro escondido por padrão no acesso credenciado -->
            <p class="register-link" id="area-cadastro" style="visibility: hidden;">Ainda não tem conta? <a href="cadastre-se.html"><span>CADASTRE-SE</span></a></p>
        </div>
    </main>

    <!-- parte do java -->
    <script>
        function mudarAcesso(tipo, elementoClicado) {
            // Remove a classe 'active' de todos os botões
            const botoes = document.querySelectorAll('.tab-btn');
            botoes.forEach(botao => botao.classList.remove('active'));
            
            // Adiciona a classe 'active' no botão clicado
            elementoClicado.classList.add('active');
            
            // Atualiza o valor do campo oculto do formulário
            document.getElementById('tipo_acesso').value = tipo;
            
            // Pega o botão de entrar e a área de cadastro
            const btnEntrar = document.getElementById('btn-entrar');
            const areaCadastro = document.getElementById('area-cadastro');
            
            if(tipo === 'credenciado') {
                btnEntrar.innerText = 'ENTRAR - CREDENCIADO';
                btnEntrar.style.backgroundColor = 'var(--earth-green)';
                
                // Esconde o botão de cadastro 
                areaCadastro.style.visibility = 'hidden'; 
            } else if (tipo === 'gerente') {
                btnEntrar.innerText = 'ENTRAR - GERENTE';
                btnEntrar.style.backgroundColor = 'var(--dark-blue)'; 
                
                // torna a frase novamente
                areaCadastro.style.visibility = 'visible'; 
            }
        }
    </script>

</body>
</html>
